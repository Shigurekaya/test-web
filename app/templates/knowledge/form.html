{% extends "base.html" %}
{% block title %}{{ '编辑文档' if doc else '新建文档' }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-end mb-3 flex-wrap gap-2">
  <div>
    <h1 class="h3 page-title mb-1">{{ '编辑文档' if doc else '新建文档' }}</h1>
    <div class="text-muted small">保存后会自动切分知识片段并同步关系图；摘要留空时会按正文首段生成。</div>
  </div>
  <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('knowledge.list_docs') }}">返回列表</a>
</div>

<div class="card panel">
  <div class="card-body">
    <form method="post">
      <div class="mb-3">
        <label class="form-label" for="fld_title">标题 <span class="text-danger">*</span></label>
        <input class="form-control" id="fld_title" name="title" required value="{{ doc.title if doc else '' }}" placeholder="如：员工年休假管理办法">
      </div>
      <div class="mb-3">
        <label class="form-label" for="fld_summary">摘要</label>
        <input class="form-control" name="summary" value="{{ doc.summary if doc else '' }}" placeholder="一句话说明文档用途；可留空自动生成" id="fld_summary">
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-3">
          <label class="form-label">部门</label>
          <select class="form-select" name="department">
            {% for d in departments %}
            <option value="{{ d }}" {% if (doc and doc.department==d) or (not doc and current_user.department==d) %}selected{% endif %}>{{ d }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">分类</label>
          <select class="form-select" name="category_id">
            <option value="">未分类</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if doc and doc.category_id==c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">可见性</label>
          <select class="form-select" name="visibility">
            {% for key, label in visibility_labels.items() %}
            <option value="{{ key }}" {% if doc and doc.visibility==key %}selected{% endif %}{% if not doc and key=='internal' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">状态</label>
          <select class="form-select" name="status">
            {% for key, label in status_labels.items() %}
            <option value="{{ key }}" {% if doc and doc.status==key %}selected{% endif %}{% if not doc and key=='published' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label" for="fld_version">版本</label>
          <input class="form-control" name="version" value="{{ doc.version if doc else '1.0' }}" id="fld_version">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="fld_tags">标签（逗号分隔）</label>
        <input class="form-control" name="tags" value="{{ doc.tags if doc else '' }}" placeholder="年假,人事" id="fld_tags">
      </div>
      <div class="mb-3">
        <label class="form-label">正文 <span class="text-danger">*</span></label>
        <textarea class="form-control" name="content" rows="14" required placeholder="支持分段书写，保存后会自动切分为知识片段">{{ doc.content if doc else '' }}</textarea>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-primary" type="submit">保存并重建索引</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('knowledge.list_docs') }}">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
