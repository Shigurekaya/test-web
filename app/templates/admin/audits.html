{% extends "base.html" %}
{% block title %}审计日志{% endblock %}
{% block content %}
<h1 class="h3 page-title mb-3">审计日志</h1>
<div class="card panel">
  <div class="table-responsive">
    <table class="table table-sm mb-0 align-middle">
      <thead><tr><th style="width:160px">时间</th><th>用户</th><th>动作</th><th>详情</th></tr></thead>
      <tbody>
        {% for log in logs %}
        <tr>
          <td class="small text-muted">{{ log.created_at|dt }}</td>
          <td>{{ log.user.username if log.user else '—' }}</td>
          <td><span class="badge text-bg-secondary">{{ log.action|action_label }}</span></td>
          <td class="small">{{ log.detail }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-muted">暂无记录</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
