{% extends "base.html" %}
{% block title %}用户列表{% endblock %}
{% block content %}
<h1 class="h3 page-title mb-3">用户列表</h1>
<div class="card panel">
  <div class="table-responsive">
    <table class="table mb-0 align-middle">
      <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>角色</th><th>部门</th><th>创建时间</th></tr></thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.id }}</td>
          <td>{{ u.username }}</td>
          <td>{{ u.display_name }}</td>
          <td><span class="badge text-bg-light text-dark">{{ u.role|role_label }}</span></td>
          <td>{{ u.department }}</td>
          <td class="small text-muted">{{ u.created_at|dt }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
