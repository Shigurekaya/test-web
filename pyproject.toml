[project]
name = "kb-wealth"
version = "2.0.0"
description = "智慧企业知识财富库系统 —— 企业知识管理 Web 应用（课程大作业）"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.3",
    "Flask-Login==0.6.3",
    "Flask-SQLAlchemy==3.1.1",
    "Werkzeug==3.0.3",
    "jieba==0.42.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "jdk4py==25.0.2.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
# 测试必须运行在独立数据库上；若某天真跑到了 instance/knowledge.db，
# 让失败立刻可见，而不是默默污染演示数据。
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "scripts/export_pages_static.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # 行宽由 line-length 控制，中文注释容易误报
    "B008",   # Flask 的 default=datetime 之类写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "scripts/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
