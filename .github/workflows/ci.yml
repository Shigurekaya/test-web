name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check app scripts tests run.py
          python -m ruff format --check app scripts tests run.py

      - name: Test (pytest)
        # 测试跑在临时内存库上，不会触碰 instance/knowledge.db。
        # 不加 --cov：pytest-cov 的 C tracer 在 Windows 上会与 jieba 的首次导入死锁。
        run: python -m pytest -q

      - name: App builds a fresh database end to end
        # 对应可靠性需求：库缺失时应能自动建表并灌入演示数据
        run: |
          python -c "from app import create_app; from app.config import TestingConfig; a=create_app(TestingConfig); c=a.test_client(); assert c.get('/health').status_code==200; print('fresh db ok')"

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        run: npm run build
