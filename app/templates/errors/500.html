{% extends "base.html" %}
{% block title %}服务器错误{% endblock %}
{% block content %}
<div class="card panel mx-auto" style="max-width:560px">
  <div class="card-body p-4 text-center">
    <div class="display-6 text-warning mb-2">500</div>
    <h1 class="h4">服务器繁忙</h1>
    <p class="text-muted">请稍后重试，或查看 instance 目录下的运行日志。</p>
    <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">返回工作台</a>
  </div>
</div>
{% endblock %}
